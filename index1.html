<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tra cứu thu hồi tiền hưởng BHXH Đợt 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 15px; background: #f5f6fa; color: #333; }
    
    .nav-tabs { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px auto; }
    .nav-tab { display: flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 30px; background: #fff; color: #334155; font-weight: 600; text-decoration: none; border: 1px solid #e5e7eb; transition: .25s; }
    .nav-tab:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.12); color: #2563eb; }
    .nav-tab.active { background: linear-gradient(135deg, #2563eb, #1e40af); color: #fff; border: none; }          
    
    h2 { text-align: center; margin-bottom: 15px; }
    .support-box { text-align: center; margin-bottom: 20px; }
    .btn-zalo { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background-color: #0068ff; color: white; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
    .qr-code { display: block; margin: 10px auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    .search-box { display: flex; gap: 8px; max-width: 480px; margin: 10px auto; flex-wrap: wrap; justify-content: center; }
    .search-box input { flex: 1; min-width: 200px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; outline: none; transition: border-color 0.2s; }
    .search-box input:focus { border-color: #0068ff; }

    .btn-search { padding: 12px 20px; background-color: #0068ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; white-space: nowrap; }
    .btn-search:hover { background-color: #0052cc; }
    .btn-search:disabled { background-color: #a0c4ff; cursor: not-allowed; }

    .btn-admin { padding: 12px 16px; background-color: #475569; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; white-space: nowrap; }
    .btn-admin:hover { background-color: #334155; }

    .admin-badge { background: #e11d48; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; vertical-align: middle; display: none; }
    .card { background: white; border-radius: 10px; padding: 15px; margin: 10px auto; max-width: 400px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); line-height: 1.6; }
    .loading { text-align: center; color: #666; margin-top: 20px; }
    .money { color: #d32f2f; font-weight: bold; }
    .status-msg { text-align: center; margin-top: 15px; padding: 10px; }
    .error { color: #d32f2f; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .search-box input { font-size: 16px; }
      .card { font-size: 15px; }
    }
  </style>
</head>

<body>

<div class="nav-tabs">
    <a href="https://bangchamcong.pages.dev" target="_blank" class="nav-tab">📋 Chấm Công</a>
    <a href="https://phepnam.pages.dev" target="_blank" class="nav-tab">📅 Phép Năm</a>
    <a href="https://noiquy.pages.dev" target="_blank" class="nav-tab">📜 Lỗi cơm</a>
    <a href="https://phucap.pages.dev" target="_blank" class="nav-tab">🥛 Phụ cấp sữa</a>
    <a href="#" class="nav-tab active">🏥 BHXH</a>
    <a href="https://rasoat.pages.dev" target="_blank" class="nav-tab">🔍 Rà soát</a>
    <a href="https://antoan.pages.dev" target="_blank" class="nav-tab">🛡️ An Toàn</a>
    <a href="https://xnc-immigration.pages.dev" target="_blank" class="nav-tab">🛂 Immigration</a>
</div>
  
<h2>
  🔍 Tra cứu thu hồi tiền hưởng BHXH Đợt 1
  <span id="adminBadge" class="admin-badge">ADMIN MODE</span>
</h2>

<div class="support-box"> 
  <a href="https://zalo.me/0348653831" target="_blank" class="btn-zalo">
    <span>💬</span> Bấm Liên hệ Hỗ Trợ
  </a>
  <p style="margin-bottom: 8px;">📱 Quét QR để mở nhanh</p>
  <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://bhxh.pages.dev/" alt="QR Code" width="180" height="180">
</div>  

<p style="text-align: center;" id="searchGuide">Nhập chính xác số Căn cước để tra cứu</p>

<div class="search-box">
  <input type="text" id="search" placeholder="Nhập chính xác số Căn cước..." onkeydown="handleKeyDown(event)">
  <button type="button" id="btnSearch" class="btn-search" onclick="search()">Tìm kiếm</button>
  <button type="button" id="authBtn" class="btn-admin" onclick="toggleAdmin()">🔑 Admin Log In</button>
</div>

<div id="result"></div>

<div style="max-width: 400px; margin: 25px auto 10px auto; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
  <b style="display: block; text-align: center; margin-bottom: 8px; color: #d32f2f;">📢 Công văn từ BHXH</b>
  <iframe src="https://drive.google.com/file/d/17yhRKPpTUNdqFdbgEWGQ-qXRrPq8SPiI/preview" width="100%" height="320" style="border: 1px solid #ccc; border-radius: 6px;" allow="autoplay"></iframe>
</div>

<div style="max-width: 400px; margin: 25px auto 10px auto; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
  <b style="display: block; text-align: center; margin-bottom: 8px; color: #d32f2f;">🔍 Danh sách</b>
  <iframe src="https://drive.google.com/file/d/14QMQMFJPufPKBoJqYKCuOkzgVuU2kXze/preview" width="100%" height="320" style="border: 1px solid #ccc; border-radius: 6px;" allow="autoplay"></iframe>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxkx_znMipTc_6rjwF4-HR1gZr5imjdnDxJKofqRcL_027U6Xc4-F3O0UgS82k3rhh-zw/exec";

let isAdmin = false;
let idleTimer = null;
const ADMIN_PASS = "12356"; 
const IDLE_LIMIT = 5 * 60 * 1000; 

window.addEventListener('DOMContentLoaded', () => {
  const sessionAuth = sessionStorage.getItem('adminAuthenticated_bhxh');
  const lastActivity = sessionStorage.getItem('lastAdminActivity_bhxh');

  if (sessionAuth === 'true' && lastActivity) {
    const timePassed = Date.now() - parseInt(lastActivity, 10);
    if (timePassed < IDLE_LIMIT) {
      activateAdminUI();
      startIdleTimer();
    } else {
      logoutAdmin(false);
    }
  }
});

function activateAdminUI() {
  isAdmin = true;
  sessionStorage.setItem('adminAuthenticated_bhxh', 'true');
  sessionStorage.setItem('lastAdminActivity_bhxh', Date.now().toString());

  document.getElementById('adminBadge').style.display = 'inline-block';
  document.getElementById('authBtn').innerText = '🚪 Đăng xuất';
  document.getElementById('search').placeholder = 'Nhập Họ Tên hoặc số Căn cước...';
  document.getElementById('searchGuide').innerText = 'Chế độ Admin: Nhập Họ Tên (tìm tương đối) hoặc Số Căn cước';
}

function logoutAdmin(showAlert = true) {
  isAdmin = false;
  sessionStorage.removeItem('adminAuthenticated_bhxh');
  sessionStorage.removeItem('lastAdminActivity_bhxh');
  
  if (idleTimer) clearTimeout(idleTimer);

  document.getElementById('adminBadge').style.display = 'none';
  document.getElementById('authBtn').innerText = '🔑 Admin Log In';
  document.getElementById('search').placeholder = 'Nhập chính xác số Căn cước...';
  document.getElementById('searchGuide').innerText = 'Nhập chính xác số Căn cước để tra cứu';

  if (showAlert) {
    alert("Đã đăng xuất quyền Admin.");
  }
}

function toggleAdmin() {
  if (!isAdmin) {
    let pass = prompt("Nhập mật khẩu Admin để tìm kiếm tự do theo Tên:");
    if (pass === ADMIN_PASS) {
      activateAdminUI();
      startIdleTimer();
      alert("Đã kích hoạt quyền Admin! Tự động đăng xuất sau 5 phút không hoạt động.");
    } else if (pass !== null) {
      alert("Mật khẩu không chính xác!");
    }
  } else {
    logoutAdmin(true);
  }
}

function resetIdleTimer() {
  if (!isAdmin) return;
  sessionStorage.setItem('lastAdminActivity_bhxh', Date.now().toString());
  if (idleTimer) clearTimeout(idleTimer);

  idleTimer = setTimeout(() => {
    logoutAdmin(false);
    alert("Phiên làm việc Admin đã hết hạn do 5 phút không có thao tác!");
  }, IDLE_LIMIT);
}

function startIdleTimer() {
  const events = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
  events.forEach(evt => {
    window.addEventListener(evt, resetIdleTimer, { passive: true });
  });
  resetIdleTimer();
}

function formatMoney(amount) {
  if (amount === undefined || amount === null || amount === "") return "0 VNĐ";
  let cleanStr = String(amount).replace(/[,.\s]/g, "");
  let num = parseFloat(cleanStr) || 0;
  return num.toLocaleString('vi-VN') + " VNĐ";
}

function handleKeyDown(event) {
  if (event.key === "Enter") {
    search();
  }
}

async function fetchWithRetry(url, retries = 3, delay = 1000) {
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
    } catch (err) {
      if (i === retries - 1) throw err;
      await new Promise(r => setTimeout(r, delay));
    }
  }
  throw new Error("Không thể kết nối đến máy chủ");
}

async function search() {
  const inputEl = document.getElementById("search");
  const btnEl = document.getElementById("btnSearch");
  const div = document.getElementById("result");
  const query = inputEl.value.trim();

  if (!query) {
    div.innerHTML = `<div class="status-msg error">⚠️ Vui lòng nhập ${isAdmin ? 'Họ Tên hoặc số Căn cước' : 'số Căn cước'} trước khi tìm kiếm!</div>`;
    return;
  }

  btnEl.disabled = true;
  div.innerHTML = `<div class="loading">⏳ Đang tìm kiếm, vui lòng đợi...</div>`;

  try {
    const requestUrl = isAdmin ? API : `${API}?q=${encodeURIComponent(query)}`;
    const rawData = await fetchWithRetry(requestUrl);

    if (!Array.isArray(rawData) || rawData.length === 0) {
      div.innerHTML = `<div class="status-msg error">❌ Không tìm thấy dữ liệu cho: ${escapeHtml(query)}</div>`;
      return;
    }

    let filteredData = [];

    const lowerQuery = query.toLowerCase();

    // Đọc đa dạng Tên Cột để tránh bị lỗi do lệch khoảng trắng hoặc hoa thường
    filteredData = rawData.filter(item => {
      let ten = String(item["Họ và tên"] || item["Họ và Tên"] || item["ten"] || item["Tên"] || "").toLowerCase();
      let ma = String(item["Mã nhân viên"] || item["Mã Nhân Viên"] || item["ma"] || item["CCCD"] || "").toLowerCase();

      if (isAdmin) {
        return ma === lowerQuery || ten.includes(lowerQuery);
      } else {
        return ma === lowerQuery;
      }
    });

    if (filteredData.length === 0) {
      div.innerHTML = `<div class="status-msg error">❌ Không tìm thấy dữ liệu phù hợp cho: ${escapeHtml(query)}</div>`;
      return;
    }

    // Xuất thông tin chuẩn theo tiêu đề cột trong hình Google Sheets
    const htmlContent = filteredData.map(item => {
      let ten = item["Họ và tên"] || item["Họ và Tên"] || item["ten"] || "";
      let ma = item["Mã nhân viên"] || item["Mã Nhân Viên"] || item["ma"] || "";
      let tien = item["Số tiền"] || item["soHop"] || 0;
      let thang = item["Tháng chưa nhận"] || item["thang"] || "";

      return `
        <div class="card">
          <b>${escapeHtml(ten)}</b><br>
          Mã NV / Số Căn cước: <b>${escapeHtml(ma)}</b><br>
          Số tiền: <span class="money">${formatMoney(tien)}</span><br>
          Tháng chưa nhận: ${escapeHtml(thang)}<br>
        </div>
      `;
    }).join('');

    div.innerHTML = htmlContent;
  } catch (err) {
    console.error(err);
    div.innerHTML = `<div class="status-msg error">⚠️ Kết nối chập chờn. Vui lòng bấm "Tìm kiếm" để thử lại!</div>`;
  } finally {
    btnEl.disabled = false;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
