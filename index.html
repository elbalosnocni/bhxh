<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tra cứu BHXH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      background: #f5f6fa;
    }

    h2 {
      text-align: center;
    }

    input {
      padding: 12px;
      width: 100%;
      max-width: 400px;
      display: block;
      margin: 10px auto;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 12px;
      margin: 10px auto;
      max-width: 400px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .loading {
      text-align: center;
      color: #888;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      input { font-size: 18px; }
      .card { font-size: 15px; }
    }
  </style>
</head>

<body>

<h2>🔍 Tra cứu BHXH</h2>
<div style="text-align:center; margin-top:10px;">
  <p>📱 Quét QR để mở nhanh</p>
  <img 
    src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://bhxh.pages.dev/" 
    alt="QR Code"
  >
</div>  

<input type="text" id="search" placeholder="Nhập chính xác số Căn cước..." onkeyup="debounceSearch()">

<div id="result"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxkx_znMipTc_6rjwF4-HR1gZr5imjdnDxJKofqRcL_027U6Xc4-F3O0UgS82k3rhh-zw/exec";

let timeoutId;

// Chờ người dùng gõ xong (500ms) mới gửi request để đỡ quá tải API
function debounceSearch() {
  clearTimeout(timeoutId);
  timeoutId = setTimeout(search, 500);
}

function search() {
  const input = document.getElementById("search").value.trim();
  const div = document.getElementById("result");

  if (!input) {
    div.innerHTML = "";
    return;
  }

  // Loading
  div.innerHTML = `<div class="loading">⏳ Đang tìm kiếm...</div>`;

  fetch(API + "?q=" + encodeURIComponent(input))
    .then(res => res.json())
    .then(data => {
      div.innerHTML = "";

      if (!data || data.length === 0) {
        div.innerHTML = `<div style="text-align:center; margin-top:15px; color:red;">❌ Không tìm thấy số Căn cước chính xác!</div>`;
        return;
      }

      data.forEach(item => {
        div.innerHTML += `
          <div class="card">
            <b>${item.ten}</b><br>
            Mã NV: <b>${item.ma}</b><br>
            Số hộp: ${item.soHop}<br>
            Tháng chưa nhận: ${item.thang}<br>
            Phòng: ${item.phong}<br>
            BP: ${item.boPhan}
          </div>
        `;
      });
    })
    .catch(err => {
      div.innerHTML = `<div style="text-align:center; color:red;">⚠️ Có lỗi xảy ra, vui lòng thử lại!</div>`;
    });
}
</script>

</body>
</html>
