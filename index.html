<!-- KHUNG TÌM KIẾM KÈM NÚT BẤM -->

  <button type="button" id="btnSearch" class="btn-search" onclick="search()">Tìm kiếm</button>
</div>

<div id="result"></div>

<!-- VỊ TRÍ HIỂN THỊ THÔNG BÁO PDF CỐ ĐỊNH PHÍA DƯỚI -->
<div style="max-width: 400px; margin: 25px auto 10px auto; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">

<div style="max-width: 400px; margin: 25px auto 10px auto; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
  <b style="display: block; text-align: center; margin-bottom: 8px; color: #d32f2f;">

    width="100%"

<script>
const API = "https://script.google.com/macros/s/AKfycbxkx_znMipTc_6rjwF4-HR1gZr5imjdnDxJKofqRcL_027U6Xc4-F3O0UgS82k3rhh-zw/exec";

// Định dạng số tiền sang chuẩn VNĐ
function formatMoney(amount) {
  if (amount === undefined || amount === null || isNaN(amount)) return "0 VNĐ";
  return Number(amount).toLocaleString('vi-VN') + " VNĐ";
}

// Bấm phím Enter để kích hoạt tìm kiếm
function handleKeyDown(event) {
  if (event.key === "Enter") {
    search();
  }
}

// Hàm Fetch tự động thử lại 3 lần nếu Google Sheet API bị nghẽn
async function fetchWithRetry(url, retries = 3, delay = 1000) {
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
    } catch (err) {
      if (i === retries - 1) throw err;
      await new Promise(r => setTimeout(r, delay)); // Chờ 1 giây trước khi thử lại
    }
  }
  throw new Error("Không thể kết nối đến máy chủ");
}

async function search() {
  const inputEl = document.getElementById("search");
  const btnEl = document.getElementById("btnSearch");
  const div = document.getElementById("result");
  const query = inputEl.value.trim();

  if (!query) {
    div.innerHTML = `<div class="status-msg error">⚠️ Vui lòng nhập số Căn cước trước khi tìm kiếm!</div>`;
    return;
  }

  // Khóa nút bấm và hiển thị trạng thái đang tải
  btnEl.disabled = true;
  div.innerHTML = `<div class="loading">⏳ Đang tìm kiếm, vui lòng đợi...</div>`;

  try {
    const data = await fetchWithRetry(`${API}?q=${encodeURIComponent(query)}`);

    if (!Array.isArray(data) || data.length === 0) {
      div.innerHTML = `<div class="status-msg error">❌ Không tìm thấy dữ liệu. Vui lòng kiểm tra lại số Căn cước!</div>`;
      return;
    }

    const htmlContent = data.map(item => `
      <div class="card">
        <b>${escapeHtml(item.ten)}</b><br>
        Số Căn cước: <b>${escapeHtml(item.ma)}</b><br>
        Số tiền cần hoàn trả: <span class="money">${formatMoney(item.soHop)}</span><br>
        Ngày thu hồi: ${escapeHtml(item.thang)}<br>
      </div>
    `).join('');

    div.innerHTML = htmlContent;
  } catch (err) {
    console.error(err);
    div.innerHTML = `<div class="status-msg error">⚠️ Kết nối chập chờn. Vui lòng bấm "Tìm kiếm" để thử lại!</div>`;
  } finally {
    btnEl.disabled = false; // Mở lại nút bấm sau khi thực hiện xong
  }
}

// Hàm phòng chống XSS
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>
